<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Iniciar sesión · Trinchera RH</title>
  <link rel="icon" type="image/jpeg" href="img/logo.jpg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body class="acceso">
  <main class="acceso-caja">
    <img class="acceso-logo" src="img/logo.jpg" alt="Trinchera RH, Recursos Humanos" width="170" height="170">
    <h1>Iniciar sesión</h1>
    <p class="subtitulo">Descarga tus documentos de forma segura</p>

    <div id="mensaje" class="mensaje" role="alert" hidden></div>

    <form id="form-login" novalidate>
      <div class="campo">
        <label for="usuario">Usuario</label>
        <input id="usuario" name="usuario" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="40" required>
      </div>
      <div class="campo">
        <label for="password">Contraseña</label>
        <div class="campo-clave">
          <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
          <button id="ver-password" class="btn-ojo" type="button" aria-label="Mostrar contraseña" aria-pressed="false">
            <i class="fa-solid fa-eye" aria-hidden="true"></i>
          </button>
        </div>
      </div>
      <button id="entrar" class="boton" type="submit">Entrar</button>
    </form>
    <p class="acceso-pie">Sistema de uso interno. Tu actividad queda registrada.</p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>

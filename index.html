<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Trinchera RH</title>
  <link rel="icon" type="image/jpeg" href="img/logo.jpg">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/forms.css">
  <link rel="stylesheet" href="css/modulos.css">
  <link rel="stylesheet" href="css/responsive.css">
  <!-- Librerías de CDN siempre con versión exacta e integridad (SRI); la CSP de vercel.json solo admite cdnjs. -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
  <a class="saltar" href="#contenido">Saltar al contenido</a>

  <div class="shell">
    <aside id="sidebar" class="sidebar" aria-label="Navegación principal">
      <div class="sidebar-logo"><img src="img/logo.jpg" alt="Trinchera RH, Recursos Humanos" width="132" height="132"></div>
      <nav>
        <ul id="menu"></ul>
      </nav>
      <div class="sidebar-pie">
        <div class="usuario-activo">
          <span id="usuario-nombre" class="nombre"></span>
          <span id="usuario-rol" class="rol"></span>
        </div>
        <ul>
          <li>
            <button id="btn-salir" class="nav-item" type="button">
              <i class="fa-solid fa-arrow-right-from-bracket" aria-hidden="true"></i><span>Cerrar sesión</span>
            </button>
          </li>
        </ul>
      </div>
    </aside>
    <div id="sidebar-fondo" class="sidebar-fondo" hidden></div>

    <div class="principal">
      <header class="topbar">
        <button id="btn-menu" class="btn-menu" type="button" aria-controls="sidebar" aria-expanded="false" aria-label="Abrir menú">
          <i class="fa-solid fa-bars" aria-hidden="true"></i>
        </button>
        <h1 id="titulo-vista">Trinchera RH</h1>
      </header>
      <main id="contenido" tabindex="-1">
        <div id="aviso-global" class="mensaje aviso" role="status" hidden></div>
        <div id="vista"></div>
      </main>
    </div>
  </div>

  <!-- Orden: config → api → utils → auth → un archivo por módulo → app (el shell va al final) -->
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/inicio.js"></script>
  <script src="js/archivos.js"></script>
  <script src="js/usuarios.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
